# Da D-016/D-017 l'hosting attivo è Cloudflare Pages, non Netlify — questo
# file non guida più nessun deploy reale. Tenuto solo come rete di
# sicurezza dormiente (D-016), a parità di redirect/header/funzione con la
# configurazione Cloudflare attiva:
#   - redirect e header: duplicati in public/_redirects e public/_headers
#     (formato nativo Cloudflare Pages)
#   - funzione Stripe: equivalente attivo in functions/api/create-checkout-session.js
#   - moduli contatto/reso/su misura: NON hanno equivalente Netlify aggiornato
#     più recente di data-netlify (rimosso dai form, D-025) — se questo file
#     tornasse mai attivo, quei moduli andrebbero ricollegati a mano.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# PACCHETTO_AUDIT_SITO punto B9: l'hub /prodotti/ è stato tolto (una
# pagina-passaggio con 3 categorie su 4 vuote, su un catalogo di 2 prodotti
# — il menu ora porta direttamente a /portafogli/). Redirect per non
# lasciare un link morto a chi avesse già l'URL vecchio salvato.
[[redirects]]
  from = "/prodotti/"
  to = "/portafogli/"
  status = 301
[[redirects]]
  from = "/prodotti"
  to = "/portafogli/"
  status = 301

# Sicurezza minima di base. Non sostituisce una revisione dedicata,
# ma evita gli errori più comuni su un sito nuovo.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
